<style>
/* Layout: a bold ink "ticket booth" header band with a progress dial, then one column of colour-coded ticket rows. */
:root {
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #16212e;
  --muted: #5d6b7a;
  --line: #d3dae2;
  --band: #16212e;
  --band-fg: #f3f5f8;
  --band-muted: #9fb0c2;
  --accent: #ff6a3d;
  --stamp: #d0381f;
  --chip: #e3ebf0;
  --c-thrill: #e0412b;
  --c-achieve: #d99a00;
  --c-travel: #1a8aa8;
  --c-exp: #7a4fd6;
  --c-skill: #2e9b57;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --paper: #172029; --ink: #e8edf2; --muted: #93a2b2;
    --line: #283544; --band: #070b10; --band-fg: #f3f5f8; --band-muted: #8496a9;
    --accent: #ff7d55; --stamp: #ff7a5e; --chip: #213040;
    --c-thrill: #ff6a52; --c-achieve: #f2b832; --c-travel: #4cb8d4; --c-exp: #a685f0; --c-skill: #52c47e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --paper: #172029; --ink: #e8edf2; --muted: #93a2b2;
  --line: #283544; --band: #070b10; --band-fg: #f3f5f8; --band-muted: #8496a9;
  --accent: #ff7d55; --stamp: #ff7a5e; --chip: #213040;
  --c-thrill: #ff6a52; --c-achieve: #f2b832; --c-travel: #4cb8d4; --c-exp: #a685f0; --c-skill: #52c47e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
}
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 640px; margin: 0 auto; }

/* Header band */
.band { background: var(--band); color: var(--band-fg); padding-block: 28px 30px; position: relative; overflow: hidden; }
.band::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 14px;
  background: radial-gradient(circle at 10px 14px, var(--bg) 7px, transparent 7.5px) 0 0 / 20px 14px repeat-x;
}
.band .inner { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
h1 {
  font-family: var(--font-display); font-weight: 900; text-transform: uppercase; margin: 0;
  font-size: clamp(3rem, 14vw, 4.8rem); line-height: .84; letter-spacing: .005em;
}
h1 em { font-style: normal; color: var(--accent); }
.mood { margin: 10px 0 0; color: var(--band-muted); font-size: .95rem; max-width: 30ch; }

.dial { position: relative; width: 116px; height: 116px; flex: none; }
.dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.dial .track { fill: none; stroke: rgba(255,255,255,.12); stroke-width: 10; }
.dial .prog { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1.2); }
.dial .val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.dial .val b { font-family: var(--font-display); font-weight: 900; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.dial .val small { font-family: var(--font-mono); font-size: .62rem; letter-spacing: .1em; color: var(--band-muted); text-transform: uppercase; }

main { padding-block: 26px 0; }
main .inner { display: flex; flex-direction: column; gap: 18px; }

form.add { display: flex; gap: 8px; flex-wrap: wrap; background: var(--paper); border: 2px solid var(--line); border-radius: 14px; padding: 8px; transition: border-color .2s; }
form.add:focus-within { border-color: var(--accent); }
form.add input {
  flex: 1 1 200px; min-width: 0; border: 0; background: transparent; color: var(--ink);
  font: inherit; font-size: 1.05rem; padding: 10px 8px;
}
form.add input:focus { outline: none; }
form.add select { font: inherit; font-size: .9rem; color: var(--ink); background: var(--chip); border: 0; border-radius: 8px; padding: 8px 10px; }
button { font: inherit; cursor: pointer; }
.btn-add { background: var(--accent); color: #fff; border: 0; border-radius: 9px; padding: 10px 20px; font-weight: 700; }
.btn-add:disabled { opacity: .4; cursor: default; }

.toolbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; }
.tabs button {
  background: none; border: 0; color: var(--muted); padding: 8px 12px 10px;
  font-weight: 700; font-size: .9rem; border-bottom: 3px solid transparent; margin-bottom: -1px;
}
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .n { font-family: var(--font-mono); font-size: .72rem; margin-left: 4px; opacity: .7; }
.surprise {
  background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 7px 14px;
  font-weight: 700; font-size: .85rem; margin-bottom: 8px; display: inline-flex; gap: 6px; align-items: center;
}
.surprise svg { width: 16px; height: 16px; }
.surprise:active { transform: scale(.96); }

.cats { display: flex; gap: 6px; flex-wrap: wrap; }
.cats button {
  border: 1.5px solid var(--line); background: var(--paper); color: var(--muted);
  border-radius: 999px; padding: 4px 11px; font-size: .78rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
}
.cats button .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.cats button[aria-pressed="true"] { border-color: var(--c, var(--ink)); color: var(--ink); background: var(--chip); }

ul.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
li.item {
  --c: var(--c-exp);
  position: relative; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px;
  background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 14px 12px 14px 14px;
  overflow: hidden; transition: transform .2s ease, box-shadow .2s ease;
}
li.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
li.item::after { content: ""; position: absolute; left: 58px; top: 10px; bottom: 10px; border-left: 2px dotted var(--line); }
li.item.picked { box-shadow: 0 0 0 3px var(--c); transform: scale(1.015); }
li.item.picked .title { color: var(--c); }
.tick {
  width: 32px; height: 32px; border-radius: 50%; border: 2.5px solid var(--c);
  background: transparent; display: grid; place-items: center; color: #fff; padding: 0;
  transition: background .2s, transform .15s;
}
.tick:hover { transform: scale(1.1); }
.done .tick { background: var(--c); }
.tick svg { width: 17px; height: 17px; opacity: 0; }
.done .tick svg { opacity: 1; }
.body { min-width: 0; padding-left: 12px; display: flex; flex-direction: column; gap: 4px; }
.title { font-weight: 700; font-size: 1.06rem; overflow-wrap: anywhere; }
.done .title { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--c); }
.date { font-family: var(--font-mono); font-size: .72rem; color: var(--muted); }
.stamp {
  position: absolute; right: 52px; top: 50%; transform: translateY(-50%) rotate(-10deg);
  font-family: var(--font-display); font-weight: 900; font-size: 1.35rem; letter-spacing: .1em;
  color: var(--stamp); border: 3px solid var(--stamp); border-radius: 6px; padding: 0 8px;
  opacity: .85; pointer-events: none; mix-blend-mode: multiply;
}
:root[data-theme="dark"] .stamp { mix-blend-mode: normal; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stamp { mix-blend-mode: normal; } }
.stamp.slam { animation: slam .45s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes slam {
  0% { transform: translateY(-50%) rotate(-24deg) scale(2.6); opacity: 0; }
  60% { opacity: .95; }
  100% { transform: translateY(-50%) rotate(-10deg) scale(1); opacity: .85; }
}
.del { background: none; border: 0; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
.del:hover { background: var(--chip); color: var(--stamp); }
.del svg { width: 18px; height: 18px; }

.empty { text-align: center; color: var(--muted); padding: 36px 16px; border: 2px dashed var(--line); border-radius: 12px; }
.empty b { display: block; font-family: var(--font-display); font-size: 1.7rem; text-transform: uppercase; color: var(--ink); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 10px 10px 16px;
  display: flex; gap: 14px; align-items: center; font-size: .92rem; font-weight: 600; max-width: calc(100% - 32px);
  box-shadow: 0 8px 28px rgba(0,0,0,.3);
}
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 8px; }
.toast button[hidden] { display: none; }
.note { color: var(--muted); font-size: .8rem; text-align: center; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 440px) {
  .dial { width: 96px; height: 96px; }
  .dial .val b { font-size: 1.8rem; }
  .stamp { right: 48px; font-size: 1.1rem; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
</style>
<style>
html { padding-top: env(safe-area-inset-top, 0px); background: var(--band); }
body { margin: 0; min-height: 100vh; }
html, body { overscroll-behavior-y: none; }
</style>
</head>
<body>

<section class="band gutter">
  <div class="inner">
    <div>
      <p class="eyebrow">Before I kick the bucket</p>
      <h1>Bucket<br><em>List</em></h1>
      <p class="mood" id="mood">Loading your adventures…</p>
    </div>
    <div class="dial" aria-label="Progress">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="50"/><circle class="prog" id="ring" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
      <div class="val"><b id="pct">0%</b><small id="tally">0 of 0</small></div>
    </div>
  </div>
</section>

<main class="gutter">
  <div class="inner">
    <form class="add" id="addForm" autocomplete="off">
      <input id="newTitle" type="text" placeholder="Add a goal… e.g. Swim with sharks" maxlength="140" aria-label="New bucket list goal">
      <select id="newCat" aria-label="Category">
        <option value="Experience">Experience</option>
        <option value="Thrill">Thrill</option>
        <option value="Achievement">Achievement</option>
        <option value="Travel">Travel</option>
        <option value="Skill">Skill</option>
      </select>
      <button class="btn-add" id="addBtn" type="submit" disabled>Add</button>
    </form>

    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button role="tab" data-f="todo" aria-selected="true">To do<span class="n" id="nTodo">0</span></button>
        <button role="tab" data-f="done" aria-selected="false">Done<span class="n" id="nDone">0</span></button>
        <button role="tab" data-f="all" aria-selected="false">All<span class="n" id="nAll">0</span></button>
      </div>
      <button class="surprise" id="surprise" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        Surprise me
      </button>
    </div>

    <div class="cats" id="cats"></div>

    <ul class="list" id="list"></ul>
    <div class="empty" id="empty" hidden></div>
    <p class="note" id="note" hidden></p>
  </div>
</main>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="undoBtn" type="button">Undo</button></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CATS = [
    { k: "Thrill", c: "--c-thrill" },
    { k: "Achievement", c: "--c-achieve" },
    { k: "Travel", c: "--c-travel" },
    { k: "Experience", c: "--c-exp" },
    { k: "Skill", c: "--c-skill" },
  ];
  const catVar = (k) => (CATS.find(x => x.k === k) || CATS[3]).c;
  const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  let items = [];
  let filter = "todo", catFilter = null;
  let db = null, col = null, loaded = false;
  let lastDeleted = null, toastTimer = null, justDone = null, pickedId = null;
  const LS = "bucket-list-items";

  const checkSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const binSvg = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

  const fmtDate = (ts) => ts ? new Date(ts).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "";
  function saveLocal() { if (db) return; try { localStorage.setItem(LS, JSON.stringify(items)); } catch (e) {} }

  function moodLine(done, total) {
    if (!loaded) return "Loading your adventures…";
    if (!total) return "A blank slate. Add the first thing you want to do.";
    const left = total - done;
    if (done === 0) return left + " adventures waiting. Pick one and go.";
    if (left === 0) return "Everything ticked off. Legend. Time to dream bigger.";
    const p = done / total;
    if (p < .25) return "Off the mark with " + done + ". " + left + " still to go.";
    if (p < .5) return "Building momentum: " + done + " down, " + left + " to go.";
    if (p < .75) return "Over halfway there with " + done + " done. Keep going.";
    return "Nearly there. Just " + left + " left.";
  }

  function renderCats() {
    const wrap = $("cats"); wrap.innerHTML = "";
    CATS.forEach(cat => {
      const n = items.filter(i => (i.category || "Experience") === cat.k).length;
      const b = document.createElement("button");
      b.type = "button"; b.style.setProperty("--c", "var(" + cat.c + ")");
      b.setAttribute("aria-pressed", String(catFilter === cat.k));
      b.innerHTML = '<span class="dot"></span>';
      b.append(cat.k + " " + n);
      b.addEventListener("click", () => { catFilter = catFilter === cat.k ? null : cat.k; render(); });
      wrap.appendChild(b);
    });
  }

  function render() {
    const done = items.filter(i => i.done).length, total = items.length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("pct").textContent = pct + "%";
    $("tally").textContent = done + " of " + total;
    $("ring").style.strokeDashoffset = String(314.16 * (1 - (total ? done / total : 0)));
    $("mood").textContent = moodLine(done, total);
    $("nTodo").textContent = total - done; $("nDone").textContent = done; $("nAll").textContent = total;
    renderCats();

    let view = items.slice();
    if (filter === "todo") view = view.filter(i => !i.done);
    if (filter === "done") view = view.filter(i => i.done);
    if (catFilter) view = view.filter(i => (i.category || "Experience") === catFilter);
    view.sort((a, b) => filter === "done"
      ? (b.doneAt || 0) - (a.doneAt || 0)
      : (a.done - b.done) || (b.createdAt || 0) - (a.createdAt || 0));

    const list = $("list"); list.innerHTML = "";
    view.forEach(it => {
      const li = document.createElement("li");
      li.className = "item" + (it.done ? " done" : "") + (it.id === pickedId ? " picked" : "");
      li.dataset.id = it.id;
      li.style.setProperty("--c", "var(" + catVar(it.category) + ")");
      const tick = document.createElement("button");
      tick.className = "tick"; tick.type = "button"; tick.innerHTML = checkSvg;
      tick.setAttribute("aria-label", it.done ? "Mark " + it.title + " as not done" : "Tick off " + it.title);
      tick.addEventListener("click", (e) => toggle(it, e));
      const body = document.createElement("div"); body.className = "body";
      const t = document.createElement("div"); t.className = "title"; t.textContent = it.title;
      const meta = document.createElement("div"); meta.className = "meta";
      const chip = document.createElement("span"); chip.className = "chip"; chip.textContent = it.category || "Experience";
      meta.appendChild(chip);
      if (it.done && it.doneAt) { const d = document.createElement("span"); d.className = "date"; d.textContent = "Done " + fmtDate(it.doneAt); meta.appendChild(d); }
      body.append(t, meta);
      const del = document.createElement("button");
      del.className = "del"; del.type = "button"; del.innerHTML = binSvg;
      del.setAttribute("aria-label", "Delete " + it.title);
      del.addEventListener("click", () => remove(it));
      li.append(tick, body, del);
      if (it.done) {
        const s = document.createElement("span"); s.className = "stamp" + (justDone === it.id ? " slam" : ""); s.textContent = "DONE";
        li.appendChild(s);
      }
      list.appendChild(li);
    });
    justDone = null;

    const empty = $("empty");
    if (!loaded) { empty.hidden = false; empty.innerHTML = "<b>Loading your list</b>Your goals will appear here."; }
    else if (!view.length) {
      empty.hidden = false;
      if (!total) empty.innerHTML = "<b>Nothing on the list yet</b>Type a goal above and press Add.";
      else if (catFilter) empty.innerHTML = "<b>Nothing here</b>No " + catFilter.toLowerCase() + " goals in this view.";
      else if (filter === "done") empty.innerHTML = "<b>Nothing ticked off yet</b>Tap the circle next to a goal once you've done it.";
      else if (filter === "todo") empty.innerHTML = "<b>All done</b>Every goal ticked off. Time to add more.";
      else empty.innerHTML = "<b>Nothing here</b>";
    } else empty.hidden = true;
  }

  // ---- confetti ----
  const fx = $("fx"), ctx = fx.getContext("2d");
  let parts = [], raf = null;
  function burst(x, y, color) {
    if (reduceMotion) return;
    const dpr = window.devicePixelRatio || 1;
    fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(document.documentElement);
    const palette = [color, cs.getPropertyValue("--accent").trim(), cs.getPropertyValue("--c-achieve").trim(), cs.getPropertyValue("--c-travel").trim(), cs.getPropertyValue("--c-exp").trim()];
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
      parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: Math.random() * 6, w: 5 + Math.random() * 5, h: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: palette[i % palette.length], life: 0 });
    }
    if (!raf) raf = requestAnimationFrame(step);
  }
  function step() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => { p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++; });
    parts = parts.filter(p => p.y < innerHeight + 20 && p.life < 160);
    parts.forEach(p => { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - p.life / 160); ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    raf = parts.length ? requestAnimationFrame(step) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }

  // ---- actions ----
  async function addItem(title, category) {
    const now = Date.now();
    const data = { title, category, done: false, doneAt: null, createdAt: now };
    if (db) {
      const ref = col.doc();
      items.push({ id: ref.id, ...data }); render();
      try { await ref.set(data); } catch (e) { showNote("Couldn't save that goal. Try again."); }
    } else { items.push({ id: "l" + now, ...data }); saveLocal(); render(); }
  }
  async function toggle(it, e) {
    const done = !it.done, doneAt = done ? Date.now() : null;
    it.done = done; it.doneAt = doneAt;
    if (done) {
      justDone = it.id; if (pickedId === it.id) pickedId = null;
      const r = e.currentTarget.getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, getComputedStyle(e.currentTarget).borderColor);
      showToast("Ticked off: " + short(it.title) + " 🎉", false);
    }
    render(); saveLocal();
    if (db) { try { await col.doc(it.id).update({ done, doneAt }); } catch (err) { showNote("Couldn't save that change."); } }
  }
  async function remove(it) {
    items = items.filter(i => i !== it); if (pickedId === it.id) pickedId = null; render(); saveLocal();
    lastDeleted = it; showToast("Deleted " + short(it.title), true);
    if (db) { try { await col.doc(it.id).delete(); } catch (e) { showNote("Couldn't delete that goal."); } }
  }
  async function undo() {
    const it = lastDeleted; if (!it) return; lastDeleted = null; hideToast();
    items.push(it); render(); saveLocal();
    if (db) { const { id, ...data } = it; try { await col.doc(id).set(data); } catch (e) {} }
  }
  function surprise() {
    const pool = items.filter(i => !i.done && (!catFilter || (i.category || "Experience") === catFilter));
    if (!pool.length) { showToast("Nothing left to pick. Add some more goals!", false); return; }
    if (filter === "done") { filter = "todo"; syncTabs(); }
    let n = 0, steps = reduceMotion ? 1 : 12;
    const spin = () => {
      pickedId = pool[Math.floor(Math.random() * pool.length)].id; render();
      if (++n < steps) setTimeout(spin, 60 + n * 18);
      else {
        const el = document.querySelector('li.item[data-id="' + CSS.escape(pickedId) + '"]');
        if (el) { el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" }); const r = el.getBoundingClientRect(); burst(r.left + 30, r.top + r.height / 2, getComputedStyle(el).getPropertyValue("--c")); }
        const it = items.find(i => i.id === pickedId);
        if (it) showToast("Your next adventure: " + short(it.title), false);
      }
    };
    spin();
  }
  const short = (s) => "“" + (s.length > 30 ? s.slice(0, 30) + "…" : s) + "”";
  function showToast(msg, withUndo) {
    $("toastMsg").textContent = msg; $("undoBtn").hidden = !withUndo; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, withUndo ? 6000 : 3500);
  }
  function hideToast() { $("toast").hidden = true; }
  function showNote(msg) { const n = $("note"); n.textContent = msg; n.hidden = false; }

  $("undoBtn").addEventListener("click", undo);
  $("surprise").addEventListener("click", surprise);
  $("newTitle").addEventListener("input", e => { $("addBtn").disabled = !e.target.value.trim(); });
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("newTitle").value.trim(); if (!v) return;
    addItem(v, $("newCat").value);
    $("newTitle").value = ""; $("addBtn").disabled = true; $("newTitle").focus();
    if (filter === "done") { filter = "todo"; syncTabs(); render(); }
  });
  function syncTabs() { document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.f === filter))); }
  document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; pickedId = null; syncTabs(); render(); }));

  render();

  const SEED = [{"id": "s0", "title": "Shoot a gun", "category": "Thrill", "done": false, "doneAt": null, "createdAt": 1792759600000}, {"id": "s1", "title": "Win on a game show", "category": "Achievement", "done": false, "doneAt": null, "createdAt": 1792759599999}, {"id": "s2", "title": "Get a Guinness World Record", "category": "Achievement", "done": false, "doneAt": null, "createdAt": 1792759599998}, {"id": "s3", "title": "Go skydiving", "category": "Thrill", "done": false, "doneAt": null, "createdAt": 1792759599997}, {"id": "s4", "title": "Do a bungee jump", "category": "Thrill", "done": false, "doneAt": null, "createdAt": 1792759599996}, {"id": "s5", "title": "Swim with sharks", "category": "Thrill", "done": false, "doneAt": null, "createdAt": 1792759599995}, {"id": "s6", "title": "See the Northern Lights", "category": "Travel", "done": false, "doneAt": null, "createdAt": 1792759599994}, {"id": "s7", "title": "Drive Route 66", "category": "Travel", "done": false, "doneAt": null, "createdAt": 1792759599993}, {"id": "s8", "title": "Visit Japan", "category": "Travel", "done": false, "doneAt": null, "createdAt": 1792759599992}, {"id": "s9", "title": "See one of the Seven Wonders of the World", "category": "Travel", "done": false, "doneAt": null, "createdAt": 1792759599991}, {"id": "s10", "title": "Run a marathon", "category": "Achievement", "done": false, "doneAt": null, "createdAt": 1792759599990}, {"id": "s11", "title": "Climb Ben Nevis", "category": "Achievement", "done": false, "doneAt": null, "createdAt": 1792759599989}, {"id": "s12", "title": "Watch a cup final at Wembley", "category": "Experience", "done": false, "doneAt": null, "createdAt": 1792759599988}, {"id": "s13", "title": "Take a hot air balloon ride", "category": "Experience", "done": false, "doneAt": null, "createdAt": 1792759599987}, {"id": "s14", "title": "Sleep under the stars", "category": "Experience", "done": false, "doneAt": null, "createdAt": 1792759599986}, {"id": "s15", "title": "Drive a supercar on a track", "category": "Thrill", "done": false, "doneAt": null, "createdAt": 1792759599985}, {"id": "s16", "title": "Learn to play an instrument", "category": "Skill", "done": false, "doneAt": null, "createdAt": 1792759599984}, {"id": "s17", "title": "Learn a new language", "category": "Skill", "done": false, "doneAt": null, "createdAt": 1792759599983}, {"id": "s18", "title": "Do a stand-up comedy set", "category": "Achievement", "done": false, "doneAt": null, "createdAt": 1792759599982}];
  function startLocal() {
    let saved = null;
    try { saved = localStorage.getItem(LS); } catch (e) {}
    if (saved === null) { items = SEED.map(x => ({ ...x })); saveLocal(); }
    else { try { items = JSON.parse(saved) || []; } catch (e) { items = []; } }
    loaded = true; render();
  }
  startLocal();
})();
</script>

</body>
</html>
